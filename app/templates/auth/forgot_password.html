{% extends "base.html" %}
{% block guest %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="brand">
            <div class="auth-logo-wrap">
                <img src="/static/icons/logo.svg" alt="NeoMuse" class="auth-logo-img">
                <span class="auth-logo-name">NeoMuse</span>
            </div>
            <p data-i18n="lbl_forgot_password_desc">Восстановление доступа</p>
        </div>

        {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success" style="background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.4);color:#86efac;border-radius:10px;padding:16px 18px;text-align:center;">
            <div style="font-size:2rem;margin-bottom:8px;">✓</div>
            <div style="font-weight:600;margin-bottom:6px;" data-i18n="lbl_password_reset_done">Пароль сброшен!</div>
            <div style="font-size:0.9rem;opacity:0.85;" data-i18n="lbl_new_password_is">Ваш новый временный пароль:</div>
            <div style="font-family:monospace;font-size:1.3rem;font-weight:700;letter-spacing:2px;margin:10px 0;color:#fff;background:rgba(0,0,0,0.3);padding:8px 16px;border-radius:8px;display:inline-block;">{{ new_password }}</div>
            <div style="font-size:0.82rem;opacity:0.7;margin-top:6px;" data-i18n="lbl_change_after_login">После входа смените пароль в настройках</div>
        </div>
        <a href="/login" class="btn btn-primary btn-lg" style="margin-top:8px;" data-i18n="btn_login">Войти</a>
        {% else %}
        <form method="post" action="/forgot-password" class="d-flex gap-4" style="flex-direction: column;">
            <div class="form-group">
                <label for="email" class="form-label" data-i18n="lbl_email">Email</label>
                <input type="email" id="email" name="email" required placeholder="your@email.com" autocomplete="email">
            </div>
            <button type="submit" class="btn btn-primary btn-lg" data-i18n="btn_reset_password">Сбросить пароль</button>
        </form>
        {% endif %}

        <div style="text-align: center; margin-top: var(--space-6);">
            <a href="/login" style="font-size: var(--text-sm); color: var(--color-text-tertiary);" data-i18n="btn_back_to_login">← Назад ко входу</a>
        </div>

        <div class="auth-lang-switcher">
            <div id="langSwitcher"></div>
        </div>
    </div>
</div>
{% endblock %}
